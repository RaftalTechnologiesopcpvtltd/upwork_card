{% extends 'admin/adminbase.html' %}

{% block content %}
<div id="content">
    {% include 'admin/header.html' %}
    <div class="main-content">
        <div class="d-flex align-items-center justify-content-between">
            <h1 class="page-title mb-4">Manage Faqs</h1>
            <!-- <span>
                <a href="{% url 'create_post' %}" class="btn btn-outline-primary" target="_blank">
                    Create
                </a>
            </span> -->
        </div>
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>Question</th>
                                <th>Answer</th>
                                <th>created_at</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for faq in faqs %}
                            <tr>
                                <td>{{ faq.question }} ?</td>
                                <td>{{ faq.answer }}</td>
                                <td>{{ faq.created_at }}</td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="5" class="text-center">No FAQs found</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
